<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>TRIPCAM — watch prototype</title>
<style>
  html,body{margin:0;height:100%;background:#000;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 50%,#1a0b24 0%,#000 70%)}
  #face{position:relative;width:min(94vw,94vh,460px);aspect-ratio:1/1;border-radius:50%;overflow:hidden;background:#000;
        box-shadow:0 0 0 6px #0c0c0c,0 0 0 9px #2a2a2a,0 0 0 14px #111,0 0 60px rgba(255,0,200,.25)}
  canvas{width:100%;height:100%;display:block}
  svg#ring{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  #label{position:absolute;top:11%;left:0;right:0;text-align:center;font-weight:900;letter-spacing:.25em;font-size:clamp(13px,4.2vmin,19px);
         text-shadow:0 0 8px #000,0 0 3px #000;transition:opacity .6s;pointer-events:none}
  #hint{position:absolute;bottom:12%;left:15%;right:15%;text-align:center;font-size:clamp(10px,2.8vmin,12px);opacity:.85;
        text-shadow:0 0 6px #000,0 0 2px #000;transition:opacity 1s;pointer-events:none;line-height:1.35}
  #menu{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
        background:radial-gradient(circle,#2b0a3dcc 0%,#000e 75%);text-align:center;padding:16%;box-sizing:border-box}
  #menu h1{margin:0 0 4px;font-size:clamp(22px,8vmin,40px);letter-spacing:.12em;font-weight:900;
           background:linear-gradient(90deg,#ff3cac,#784ba0,#2b86c5,#00ffd0,#ff3cac);background-size:300% 100%;
           -webkit-background-clip:text;background-clip:text;color:transparent;animation:sl 4s linear infinite}
  @keyframes sl{to{background-position:300% 0}}
  #menu button{width:78%;padding:10px 0;border-radius:999px;border:1px solid #fff4;background:#ffffff14;color:#fff;
               font-weight:700;font-size:clamp(12px,3.6vmin,15px);letter-spacing:.05em;cursor:pointer}
  #menu button:active{background:#ffffff33}
  #menu .main{background:linear-gradient(90deg,#ff3cac,#784ba0);border:none}
  #msg{font-size:clamp(10px,2.8vmin,12px);opacity:.85;min-height:1.2em;max-width:90%}
  #flip{position:absolute;bottom:4.5%;left:50%;transform:translateX(-50%);width:34px;height:34px;border-radius:50%;
        border:1px solid #fff5;background:#0008;color:#fff;font-size:16px;display:none;cursor:pointer}
  input{display:none}
</style>
</head>
<body>
<div id="wrap">
  <div id="face">
    <canvas id="c" width="400" height="400"></canvas>
    <svg id="ring" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="47" fill="none" stroke="#ffffff22" stroke-width="2"/>
      <circle id="arc" cx="50" cy="50" r="47" fill="none" stroke="url(#g)" stroke-width="2.4" stroke-linecap="round"
              transform="rotate(-90 50 50)" stroke-dasharray="0 400"/>
      <g id="dots"></g>
      <defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#00ffd0"/><stop offset=".5" stop-color="#ff3cac"/><stop offset="1" stop-color="#ffe53c"/></linearGradient></defs>
    </svg>
    <div id="label">SLICES</div>
    <div id="hint">tap / swipe = next effect<br>drag the edge (bezel) = intensity<br>hold = menu</div>
    <button id="flip" title="Switch camera">⟲</button>
    <div id="menu">
      <h1>TRIPCAM</h1>
      <button class="main" id="bCam">▶ Live camera</button>
      <button id="bFile">Photo / video</button>
      <button id="bDemo">Demo (no camera)</button>
      <div id="msg"></div>
    </div>
    <input type="file" id="file" accept="image/*,video/*">
  </div>
</div>

<script>
(() => {
const MODES = ['SLICES','KALEIDO','GLITCH','MELT','ECHO','ACID','VORTEX'];
const MODE_IDS = [6,0,1,2,3,4,5]; // shader effect id for each menu slot
const $ = id => document.getElementById(id);
const cv = $('c'), face = $('face');
const gl = cv.getContext('webgl', {antialias:false, premultipliedAlpha:false});
if (!gl) { $('msg').textContent = 'WebGL not supported on this device.'; return; }

const VS = `attribute vec2 p;varying vec2 uv;void main(){uv=p*.5+.5;gl_Position=vec4(p,0.,1.);}`;

const FS = `precision highp float;
varying vec2 uv;
uniform sampler2D cam, prev;
uniform float t, k, mode, src, mirror;
uniform vec2 camScale;
const float TAU=6.2831853;
vec3 hue(vec3 c,float a){vec3 q=vec3(.57735);float ca=cos(a);return c*ca+cross(q,c)*sin(a)+q*dot(q,c)*(1.-ca);}
float h21(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
  return mix(mix(h21(i),h21(i+vec2(1,0)),f.x),mix(h21(i+vec2(0,1)),h21(i+1.),f.x),f.y);}
float L(vec3 c){return dot(c,vec3(.299,.587,.114));}
vec3 C(vec2 u){
  u=1.-abs(1.-mod(u,2.));
  if(mirror>.5)u.x=1.-u.x;
  if(src<.5){
    vec2 q=(u-.5)*6.;
    float v=sin(q.x+t)+sin(q.y*1.3-t*.7)+sin(length(q)*2.-t*1.5);
    float face=smoothstep(.32,.3,length(u-vec2(.5,.52)));
    vec3 bg=.5+.5*cos(vec3(0,2,4)+v*1.2+t*.3);
    return mix(bg*.6,vec3(1.,.8,.6)*(.7+.3*sin(u.y*30.)),face);
  }
  u=(u-.5)*camScale+.5;
  return texture2D(cam,u).rgb;
}
vec3 P(vec2 u){return texture2D(prev,clamp(u,0.,1.)).rgb;}
void main(){
  vec2 u=uv, c=u-.5;
  float r=length(c), a=atan(c.y,c.x);
  vec3 col;
  int m=int(mode+.5);
  if(m==0){ // FRACTAL: kaleidoscope + Kali fold
    float n=6.+2.*floor(k*9.);          // visible slices: 6 at 0%, up to 24 at 100% (always even = seamless)
    float sa=TAU/(n*.5);
    float aa=mod(a+t*.15,sa);
    aa=abs(aa-sa*.5);                   // mirrored pairs
    vec2 z=vec2(cos(aa),sin(aa))*r*(1.6+.4*sin(t*.4));
    float iters=1.+k*4.;
    for(int i=0;i<5;i++){
      if(float(i)>=iters)break;
      z=abs(z)/clamp(dot(z,z),.12,4.)-vec2(.85+.12*sin(t*.23),.55+.1*cos(t*.31));
    }
    col=C(z*.5+.5);
    col=hue(col,r*7.*k+t*.6);
    col=mix(col,col*col*1.8,.3*k);
  } else if(m==1){ // GLITCH
    float tt=floor(t*(6.+10.*k));
    float row=floor(u.y*(14.+20.*k));
    vec2 g=u;
    if(h21(vec2(row,tt))<.12+.35*k) g.x+=(h21(vec2(tt,row))-.5)*.5*k;
    float bx=h21(floor(u*vec2(7.,11.))+tt);
    if(bx<.1*k) g=g+vec2(h21(vec2(tt,3.))-.5,h21(vec2(tt,5.))-.5)*.3;
    float s=.006+.035*k*(.5+.5*sin(t*13.));
    col=vec3(C(g+vec2(s,0)).r,C(g).g,C(g-vec2(s,.3*s)).b);
    col*=.82+.18*sin(u.y*500.+t*40.);
    if(bx>.96-.12*k) col=floor(col*3.)/3.*vec3(1.,.4,1.2);
    if(h21(vec2(tt,7.))<.07*k) col=1.-col;
    col+=step(.995-.02*k,h21(u*400.+t))*.6;
  } else if(m==2){ // MELT: feedback drips downward
    float n=noise(vec2(u.x*10.,t*.4));
    float drip=(.0015+.012*k)*(.3+1.4*n*n);
    vec2 w=vec2((noise(vec2(u.y*6.,t*.7))-.5)*.006*k,drip);
    vec3 pr=P(u+w);
    vec3 cm=C(u);
    float fresh=mix(.2,.025,k)+.25*step(.75,L(cm))*(1.-k);
    col=mix(pr,cm,fresh);
    col=hue(col,.012*k);
    col=mix(col,col*vec3(1.04,1.,1.06),k);
  } else if(m==3){ // ECHO: zoom/rotate feedback tunnel
    float rot=.004+.03*k*sin(t*.2+1.);
    float zr=.985-.05*k;
    vec2 q=mat2(cos(rot),-sin(rot),sin(rot),cos(rot))*c*zr;
    vec3 pr=hue(P(q+.5),.05+.15*k)*(.93+.05*k);
    vec3 cm=C(u);
    float edge=smoothstep(.05,.25,abs(L(C(u+.004))-L(cm))*6.);
    col=max(cm*(1.-.6*k)+edge*k*.6,pr);
  } else if(m==4){ // ACID: domain warp + luminance color cycling
    vec2 w=u;
    for(int i=0;i<3;i++){w+=.035*k*vec2(sin(w.y*9.+t*1.3+float(i)),cos(w.x*9.-t*1.1));}
    vec3 cm=C(w); float l=L(cm);
    vec3 ac=.5+.5*cos(TAU*(l*(1.5+3.*k)+t*.25+vec3(0.,.33,.67)));
    col=mix(cm,ac,.35+.65*k);
  } else if(m==6){ // SLICES: camera cut into 6 pizza slices that pull apart
    float n=6., sa=TAU/n;
    float idx=floor(mod(a+TAU,TAU)/sa);
    float mid=(idx+.5)*sa;
    vec2 dir=vec2(cos(mid),sin(mid));
    float gap=.07*k*(.7+.3*sin(t*1.6+idx*1.7));
    vec2 q=c-dir*gap;
    float aq=atan(q.y,q.x);
    float rel=mod(aq-idx*sa+TAU,TAU);
    float rq=length(q);
    float inside=step(rel,sa)*step(rq,.5);
    float spin=k*.5*sin(t*.8+idx*2.1);
    vec2 s2=mat2(cos(spin),-sin(spin),sin(spin),cos(spin))*q;
    col=C(s2+.5);
    col=hue(col,idx*1.05*k);
    float edge=min(rel,sa-rel)*rq;
    col*=smoothstep(.0,.004+.004*k,edge);
    col*=inside;
  } else { // VORTEX
    float sw=(1.-smoothstep(0.,.55,r))*(1.5+7.*k)*sin(t*.45);
    float aa=a+sw;
    vec2 q=vec2(cos(aa),sin(aa))*r*(1.+.15*k*sin(r*30.-t*4.));
    col=C(q+.5);
    col=hue(col,sin(r*18.-t*3.)*k*1.5);
  }
  gl_FragColor=vec4(clamp(col,0.,1.),1.);
}`;

const BS = `precision mediump float;varying vec2 uv;uniform sampler2D img;
void main(){vec3 c=texture2D(img,uv).rgb;float r=length(uv-.5);c*=1.-smoothstep(.38,.5,r)*.55;gl_FragColor=vec4(c,1.);}`;

function prog(vs, fs){
  const mk=(type,src)=>{const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(s);return s;};
  const p=gl.createProgram();gl.attachShader(p,mk(gl.VERTEX_SHADER,vs));gl.attachShader(p,mk(gl.FRAGMENT_SHADER,fs));
  gl.bindAttribLocation(p,0,'p');gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw gl.getProgramInfoLog(p);
  const u={};const n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);
  for(let i=0;i<n;i++){const nm=gl.getActiveUniform(p,i).name;u[nm]=gl.getUniformLocation(p,nm);}
  return {p,u};
}
let main, blit;
try { main=prog(VS,FS); blit=prog(VS,BS); }
catch(e){ $('msg').textContent='Shader error: '+e; console.error(e); return; }

const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);

function tex(w,h){const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);return t;}
const W=cv.width,H=cv.height;
const fb=[0,1].map(()=>{const t=tex(W,H);const f=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);return {t,f};});
gl.bindFramebuffer(gl.FRAMEBUFFER,null);
const camTex=tex(2,2);

// ---------- state ----------
let mode=0, k=0, src=0, mirror=0, media=null, isImage=false, imgDirty=false, camScale=[1,1];
let stream=null, facing='user', running=false, ping=0;
const video=document.createElement('video');video.muted=true;video.playsInline=true;video.setAttribute('playsinline','');video.loop=true;

// ring dots
const dots=$('dots');
MODES.forEach((_,i)=>{const a=(-90+ (i-(MODES.length-1)/2)*7)*Math.PI/180;
  const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
  c.setAttribute('cx',50+42*Math.cos(a));c.setAttribute('cy',50+42*Math.sin(a));c.setAttribute('r',1.2);dots.appendChild(c);});
function ui(){
  const L=2*Math.PI*47;$('arc').setAttribute('stroke-dasharray',`${(L*k).toFixed(1)} 400`);
  [...dots.children].forEach((d,i)=>d.setAttribute('fill',i===mode?'#fff':'#ffffff44'));
}
let labelT;
function showLabel(txt){const l=$('label');l.textContent=txt;l.style.opacity=1;clearTimeout(labelT);labelT=setTimeout(()=>l.style.opacity=.0,1600);}
function setMode(m){mode=(m+MODES.length)%MODES.length;showLabel(MODES[mode]);ui();
  if(navigator.vibrate)try{navigator.vibrate(12)}catch(e){}}
function setK(v){k=Math.min(1,Math.max(0,v));ui();showLabel(MODES[mode]+' '+Math.round(k*100)+'%');}

function setScale(w,h){camScale=[Math.min(1,h/w),Math.min(1,w/h)];}

// ---------- sources ----------
async function startCam(){
  $('msg').textContent='Asking for camera…';
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('no getUserMedia');
    if(stream)stream.getTracks().forEach(t=>t.stop());
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:640},height:{ideal:480}},audio:false});
    video.srcObject=stream;await video.play();
    src=1;isImage=false;media=video;mirror=facing==='user'?1:0;$('flip').style.display='block';go();
  }catch(e){
    console.warn(e);
    $('msg').innerHTML='Live camera is blocked here. Open this page from a website (https) or your own browser — or use <b>Photo / video</b>.';
  }
}
$('bCam').onclick=startCam;
$('flip').onclick=e=>{e.stopPropagation();facing=facing==='user'?'environment':'user';startCam();};
$('bDemo').onclick=()=>{src=0;mirror=0;$('flip').style.display='none';go();};
$('bFile').onclick=()=>$('file').click();
$('file').onchange=e=>{
  const f=e.target.files[0];if(!f)return;const url=URL.createObjectURL(f);
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
  $('flip').style.display='none';mirror=0;
  if(f.type.startsWith('video')){video.srcObject=null;video.src=url;video.play().catch(()=>{});media=video;isImage=false;src=1;go();}
  else{const im=new Image();im.onload=()=>{media=im;isImage=true;imgDirty=true;src=1;setScale(im.width,im.height);go();};im.src=url;}
  e.target.value='';
};
function go(){$('menu').style.display='none';running=true;setMode(mode);
  $('hint').style.opacity=.85;setTimeout(()=>$('hint').style.opacity=0,4000);}

// ---------- input: tap / swipe / bezel drag / hold ----------
let pd=null, holdT=null;
function rel(e){const b=face.getBoundingClientRect();return {x:(e.clientX-b.left)/b.width-.5,y:(e.clientY-b.top)/b.height-.5};}
face.addEventListener('pointerdown',e=>{
  if(!running)return;
  const p=rel(e);pd={...p,sx:e.clientX,sy:e.clientY,t:performance.now(),edge:Math.hypot(p.x,p.y)>.36,ang:Math.atan2(p.y,p.x),k0:k,moved:false};
  clearTimeout(holdT);holdT=setTimeout(()=>{if(pd&&!pd.moved){pd=null;running=false;$('menu').style.display='flex';$('msg').textContent='';}},750);
});
face.addEventListener('pointermove',e=>{
  if(!pd)return;const dx=e.clientX-pd.sx,dy=e.clientY-pd.sy;if(Math.hypot(dx,dy)>8)pd.moved=true;
  if(pd.edge){const p=rel(e);let a=Math.atan2(p.y,p.x),d=a-pd.ang;if(d>Math.PI)d-=2*Math.PI;if(d<-Math.PI)d+=2*Math.PI;
    pd.ang=a;setK(k+d/(Math.PI*1.2));}
  else if(Math.abs(dy)>Math.abs(dx)*1.3&&pd.moved){setK(pd.k0-dy/(face.clientHeight*.7));}
});
face.addEventListener('pointerup',e=>{
  clearTimeout(holdT);if(!pd)return;const dx=e.clientX-pd.sx,dy=e.clientY-pd.sy,dt=performance.now()-pd.t;
  if(!pd.edge){
    if(!pd.moved&&dt<400)setMode(mode+1);
    else if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy))setMode(mode+(dx<0?1:-1));
  }
  pd=null;
});
face.addEventListener('pointercancel',()=>{clearTimeout(holdT);pd=null;});
window.addEventListener('wheel',e=>{if(running){e.preventDefault();setK(k-e.deltaY*.0012);}},{passive:false});
window.addEventListener('keydown',e=>{if(!running)return;
  if(e.key==='ArrowRight'||e.key===' ')setMode(mode+1);if(e.key==='ArrowLeft')setMode(mode-1);
  if(e.key==='ArrowUp')setK(k+.05);if(e.key==='ArrowDown')setK(k-.05);});

// ---------- render loop ----------
const t0=performance.now();
function frame(){
  requestAnimationFrame(frame);
  const t=(performance.now()-t0)/1000;
  if(src===1&&media){
    gl.bindTexture(gl.TEXTURE_2D,camTex);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
    if(isImage){if(imgDirty){gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,media);imgDirty=false;}}
    else if(video.readyState>=2&&video.videoWidth){setScale(video.videoWidth,video.videoHeight);
      gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,video);}
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);
  }
  const a=fb[ping],b=fb[1-ping];
  gl.bindFramebuffer(gl.FRAMEBUFFER,a.f);gl.viewport(0,0,W,H);
  gl.useProgram(main.p);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,camTex);gl.uniform1i(main.u.cam,0);
  gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,b.t);gl.uniform1i(main.u.prev,1);
  gl.uniform1f(main.u.t,t);gl.uniform1f(main.u.k,k);gl.uniform1f(main.u.mode,MODE_IDS[mode]);
  gl.uniform1f(main.u.src,src);gl.uniform1f(main.u.mirror,mirror);gl.uniform2f(main.u.camScale,camScale[0],camScale[1]);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,W,H);
  gl.useProgram(blit.p);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,a.t);gl.uniform1i(blit.u.img,0);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  ping=1-ping;
}
ui();frame();
})();
</script>
</body>
</html>
