name: TRIPCAM Android build

on:
  push:
    branches: [tripcam-android]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build TRIPCAM APK (one app for phone + watch)
        working-directory: tripcam-android
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Collect APKs
        run: |
          mkdir out
          cp tripcam-android/app/build/outputs/apk/release/app-release.apk out/TRIPCAM.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: tripcam-apks
          path: out/

      - name: Publish download (release "tripcam-latest")
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tripcam-latest
          name: TRIPCAM — one app for phone + Galaxy Watch
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          files: out/*.apk
          body: |
            **TRIPCAM.apk** — one app. Install the same file on your phone and your Galaxy Watch.
            Open TRIPCAM on the watch → the camera opens on your phone and the trippy feed streams to the watch.
            Watch: tap = next effect · long-press = previous · turn bezel = intensity · swipe away = closes the phone camera
